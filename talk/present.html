<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presenter · Your Tool Is in Another Castle</title>
<style>
:root {
  --bg: #001f27;
  --panel: #073642;
  --rule: #24515b;
  --muted: #839496;
  --text: #eee8d5;
  --bright: #fdf6e3;
  --cyan: #2aa198;
  --green: #859900;
  --yellow: #b58900;
  --orange: #cb4b16;
  --red: #dc322f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); }
body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 14px 18px; border-bottom: 1px solid var(--rule); background: #002b36; }
.title { color: var(--bright); font-size: 16px; }
.controls { display: flex; align-items: center; gap: 8px; }
button { padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--text); font: 13px/1 var(--mono); cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--cyan); color: var(--bright); outline: none; }
#timer { min-width: 90px; color: var(--green); font-size: 20px; text-align: center; }
#timer.warn { color: var(--yellow); }
#timer.over { color: var(--red); }
main { display: grid; grid-template-columns: clamp(240px, 23vw, 380px) minmax(0, 1fr); gap: 18px; min-height: 0; padding: 16px; }
.rail { display: grid; grid-template-rows: auto auto; align-content: start; gap: 14px; min-height: 0; }
.stage, .next-wrap, .notes-wrap { min-height: 0; }
.label { margin-bottom: 8px; color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.frame { overflow: hidden; border: 1px solid var(--rule); border-radius: 8px; background: #002b36; box-shadow: 0 18px 40px rgba(0,0,0,.22); }
.frame.current, .frame.next { width: 100%; aspect-ratio: 16 / 9; }
iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
.notes-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr); }
#notes { overflow: auto; padding: 20px 26px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--text); font-family: Georgia, serif; font-size: 20px; line-height: 1.5; white-space: pre-wrap; }
#notes > p { max-width: 68ch; margin: 0 0 .85em; }
#notes > p:last-child { margin-bottom: 0; }
#notes code { padding: .1em .38em; border: 1px solid rgba(147,161,161,.28); border-radius: 4px; background: rgba(0,31,39,.8); color: var(--orange); font-family: var(--mono); font-size: .84em; }
#notes strong { color: var(--bright); }
footer { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; padding: 12px 18px; border-top: 1px solid var(--rule); background: #002b36; }
#counter { min-width: 90px; color: var(--bright); }
#heading { overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.nav { display: flex; gap: 8px; }
.shortcut { color: var(--muted); }
@media (max-width: 1050px) {
  body, main { overflow: auto; }
  main { grid-template-columns: 1fr; }
  .rail { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
  #notes { min-height: 44vh; }
}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Your Tool Is in Another Castle</div>
    <div class="shortcut">←/→ navigate · T timer · R reset · P audience · F fullscreen</div>
  </div>
  <div class="controls">
    <button id="audience" type="button">Open audience</button>
    <button id="timer-toggle" type="button">Start timer</button>
    <button id="timer-reset" type="button">Reset</button>
    <div id="timer">00:00</div>
  </div>
</header>

<main>
  <div class="rail">
    <section class="stage">
      <div class="label">Current slide</div>
      <div class="frame current"><iframe id="current" title="Current slide preview" src="deck.html?mode=preview"></iframe></div>
    </section>
    <section class="next-wrap">
      <div class="label">Next slide</div>
      <div class="frame next"><iframe id="next" title="Next slide preview" src="deck.html?mode=preview"></iframe></div>
    </section>
  </div>
  <section class="notes-wrap">
    <div class="label">Speaker notes</div>
    <div id="notes">Loading notes…</div>
  </section>
</main>

<footer>
  <div id="counter">1 / 23</div>
  <div id="heading"></div>
  <div class="nav">
    <button id="previous" type="button">← Previous</button>
    <button id="next-button" type="button">Next →</button>
  </div>
</footer>

<script>
(() => {
  const channel = new BroadcastChannel("mcp-mirror-talk");
  const currentFrame = document.querySelector("#current");
  const nextFrame = document.querySelector("#next");
  const notesElement = document.querySelector("#notes");
  const counter = document.querySelector("#counter");
  const heading = document.querySelector("#heading");
  const timerElement = document.querySelector("#timer");
  const timerButton = document.querySelector("#timer-toggle");
  const targetSeconds = 28 * 60;
  let slides = [];
  let scriptNotes = new Map();
  let index = 0;
  let elapsed = 0;
  let running = false;
  let interval;
  let audienceWindow;

  function preview(frame, slideIndex) {
    frame.contentWindow?.postMessage({ type: "talk-slide", index: slideIndex }, "*");
  }

  function fitNotes() {
    let size = 28;
    notesElement.style.fontSize = `${size}px`;
    while (size > 12 && notesElement.scrollHeight > notesElement.clientHeight) {
      size -= 0.5;
      notesElement.style.fontSize = `${size}px`;
    }
  }

  // script.md hard-wraps prose at ~78 columns. Those breaks are source
  // formatting, not intent, so join them back into paragraphs and let the box
  // wrap. Blocks containing list or aligned lines keep their own line breaks.
  function renderNotes(text) {
    const marked = /^\s*(?:[-*>]\s|\d+\.\s)|^\s{2,}\S/;
    const blocks = text.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      return lines.some((line) => marked.test(line)) ? block : lines.map((line) => line.trim()).join(" ");
    });
    notesElement.replaceChildren(...blocks.filter(Boolean).map((block) => {
      const paragraph = document.createElement("p");
      // Render markdown backticks as code chips rather than printing the ticks.
      for (const part of block.split(/(`[^`]+`)/g)) {
        if (!part) continue;
        if (part.length > 2 && part.startsWith("`") && part.endsWith("`")) {
          const code = document.createElement("code");
          code.textContent = part.slice(1, -1);
          paragraph.append(code);
        } else {
          paragraph.append(part);
        }
      }
      return paragraph;
    }));
    fitNotes();
  }

  function saveAndBroadcast() {
    const state = { index, elapsed, running };
    localStorage.setItem("mcp-mirror-talk-state", JSON.stringify(state));
    channel.postMessage({ type: "slide", index });
  }

  function show(nextIndex) {
    if (!slides.length) return;
    index = Math.max(0, Math.min(slides.length - 1, nextIndex));
    const slide = slides[index];
    const nextSlide = slides[Math.min(index + 1, slides.length - 1)];
    preview(currentFrame, index);
    preview(nextFrame, Math.min(index + 1, slides.length - 1));
    counter.textContent = `${index + 1} / ${slides.length}`;
    heading.textContent = slide.heading;
    renderNotes(scriptNotes.get(index + 1) || slide.notes || "No notes for this slide.");
    nextFrame.style.opacity = index === slides.length - 1 ? ".25" : "1";
    nextFrame.title = `Next slide: ${nextSlide.heading}`;
    saveAndBroadcast();
  }

  function paintTimer() {
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    timerElement.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    timerElement.className = elapsed > targetSeconds ? "over" : elapsed > targetSeconds - 180 ? "warn" : "";
    timerButton.textContent = running ? "Pause timer" : "Start timer";
    localStorage.setItem("mcp-mirror-talk-state", JSON.stringify({ index, elapsed, running }));
  }

  function toggleTimer() {
    running = !running;
    clearInterval(interval);
    if (running) interval = setInterval(() => {
      elapsed += 1;
      paintTimer();
    }, 1000);
    paintTimer();
  }

  function resetTimer() {
    elapsed = 0;
    running = false;
    clearInterval(interval);
    paintTimer();
  }

  function openAudience() {
    audienceWindow = window.open("deck.html?mode=audience", "mcp-mirror-audience");
    setTimeout(saveAndBroadcast, 250);
    audienceWindow?.focus();
  }

  async function load() {
    const [deckText, scriptText] = await Promise.all([
      fetch("deck.html").then((response) => response.text()),
      fetch("script.md").then((response) => response.text()),
    ]);
    const deckDocument = new DOMParser().parseFromString(deckText, "text/html");
    slides = [...deckDocument.querySelectorAll(".slide:not(.appendix)")].map((slide) => ({
      heading: slide.querySelector("h1,h2,h3")?.textContent.replace(/\s+/g, " ").trim() || "Untitled slide",
      notes: slide.dataset.notes || "",
    }));
    for (const match of scriptText.matchAll(/^## (\d+) ·[^\n]*\n+([\s\S]*?)(?=^## |\n---)/gm)) {
      scriptNotes.set(Number(match[1]), match[2].trim().replace(/^_([^_]+)_$/gm, "$1"));
    }
    try {
      const saved = JSON.parse(localStorage.getItem("mcp-mirror-talk-state") || "null");
      if (Number.isInteger(saved?.index)) index = saved.index;
      if (Number.isInteger(saved?.elapsed)) elapsed = saved.elapsed;
    } catch {}
    show(index);
    paintTimer();
  }

  document.querySelector("#previous").addEventListener("click", () => show(index - 1));
  document.querySelector("#next-button").addEventListener("click", () => show(index + 1));
  document.querySelector("#audience").addEventListener("click", openAudience);
  timerButton.addEventListener("click", toggleTimer);
  document.querySelector("#timer-reset").addEventListener("click", resetTimer);
  currentFrame.addEventListener("load", () => preview(currentFrame, index));
  nextFrame.addEventListener("load", () => preview(nextFrame, Math.min(index + 1, slides.length - 1)));
  channel.addEventListener("message", (event) => {
    if (event.data?.type === "audience-ready") saveAndBroadcast();
  });
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitNotes, 120);
  });
  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (["ArrowRight", " ", "PageDown"].includes(event.key)) {
      event.preventDefault();
      show(index + 1);
    } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
      event.preventDefault();
      show(index - 1);
    } else if (event.key.toLowerCase() === "t") {
      toggleTimer();
    } else if (event.key.toLowerCase() === "r") {
      resetTimer();
    } else if (event.key.toLowerCase() === "p") {
      openAudience();
    } else if (event.key.toLowerCase() === "f") {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });

  load().catch((error) => {
    notesElement.textContent = `Presenter failed to load: ${error.message}`;
    console.error(error);
  });
})();
</script>
</body>
</html>
